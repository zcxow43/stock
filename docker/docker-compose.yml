services:
  mysql:
    image: mysql:8.4
    container_name: stock-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: "1234"
      MYSQL_DATABASE: stock
      MYSQL_USER: app
      MYSQL_PASSWORD: "1234"
      TZ: Asia/Taipei
    ports:
      - "3306:3306"
    volumes:
      - stock-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "app", "-p1234"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  stock-mysql-data:
    name: stock-mysql-data
