server:
  port: 0

spring:
  application:
    name: backend-test
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/stock?useSSL=false&serverTimezone=UTC&characterEncoding=UTF-8
    username: app
    password: 1234
    driver-class-name: com.mysql.cj.jdbc.Driver

mybatis:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true

app:
  external:
    twse-daily-all-url: https://openapi.twse.com.tw/v1/exchangeReport/STOCK_DAY_ALL
    finmind-base-url: https://api.finmindtrade.com/api/v4/data
    finmind-token: ""
    yahoo-finance-base-url: https://query1.finance.yahoo.com/v8/finance/chart
    connect-timeout-ms: 10000
    read-timeout-ms: 15000
  backfill:
    executor-pool-size: 1
    rate-limit:
      interval-ms: 20
      max-retries: 3
      initial-backoff-ms: 30
      backoff-multiplier: 2
    max-attempt-count: 5
  minute-price:
    max-attempt-count: 3
