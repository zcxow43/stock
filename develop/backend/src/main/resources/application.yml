server:
  port: 8080

spring:
  application:
    name: backend
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/stock?useSSL=false&serverTimezone=Asia%2FTaipei&characterEncoding=UTF-8
    username: app
    password: 1234
    driver-class-name: com.mysql.cj.jdbc.Driver

mybatis:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true

app:
  external:
    twse-daily-all-url: https://openapi.twse.com.tw/v1/exchangeReport/STOCK_DAY_ALL
    twse-industry-url: https://openapi.twse.com.tw/v1/opendata/t187ap03_L
    finmind-base-url: https://api.finmindtrade.com/api/v4/data
    finmind-token: ""
    yahoo-finance-base-url: https://query1.finance.yahoo.com/v8/finance/chart
    connect-timeout-ms: 10000
    read-timeout-ms: 15000
  backfill:
    # Stocks processed concurrently (spec: 逐檔抓取由序列改為 8 檔並行). The per-source request
    # interval below is a shared, batch-wide throttle (SourceRateLimiter) -- raising this does NOT
    # multiply the request rate against either source.
    executor-pool-size: 8
    rate-limit:
      # Minimum interval between consecutive requests to the SAME source, shared across every
      # concurrent worker (spec: 每個來源各自維持至少 0.5 秒的請求間隔).
      interval-ms: 500
      max-retries: 5
      initial-backoff-ms: 2000
      backoff-multiplier: 2
      # Used only when a block-class response doesn't itself carry a retry_after (spec: 到期時間的取得).
      default-block-cooldown-seconds: 600
    max-attempt-count: 5
    startup-catch-up:
      enabled: true
      # Quoted deliberately: unquoted YYYY-MM-DD is parsed by YAML as a timestamp,
      # which binds to LocalDate as "Thu Jan 01 ..." and fails at startup.
      start-date: "2026-01-01"
  master-sync:
    # Runs before startup-catch-up (see StartupCatchUpRunner), independent switch.
    startup:
      enabled: true
  indicator:
    executor-pool-size: 4
    max-attempt-count: 5
    warmup-trading-days: 250
  minute-price:
    max-attempt-count: 3
