server:
  port: 8080

spring:
  application:
    name: backend
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/stock?useSSL=false&serverTimezone=Asia%2FTaipei&characterEncoding=UTF-8
    username: app
    password: 1234
    driver-class-name: com.mysql.cj.jdbc.Driver

mybatis:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true

app:
  external:
    twse-daily-all-url: https://openapi.twse.com.tw/v1/exchangeReport/STOCK_DAY_ALL
    finmind-base-url: https://api.finmindtrade.com/api/v4/data
    finmind-token: ""
    yahoo-finance-base-url: https://query1.finance.yahoo.com/v8/finance/chart
    connect-timeout-ms: 10000
    read-timeout-ms: 15000
  backfill:
    executor-pool-size: 1
    rate-limit:
      interval-ms: 1000
      max-retries: 5
      initial-backoff-ms: 2000
      backoff-multiplier: 2
    max-attempt-count: 5
    startup-catch-up:
      enabled: true
      # Quoted deliberately: unquoted YYYY-MM-DD is parsed by YAML as a timestamp,
      # which binds to LocalDate as "Thu Jan 01 ..." and fails at startup.
      start-date: "2026-01-01"
  indicator:
    executor-pool-size: 4
    max-attempt-count: 5
    warmup-trading-days: 250
  minute-price:
    max-attempt-count: 3
