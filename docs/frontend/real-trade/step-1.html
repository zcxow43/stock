<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>真實交易分頁</title>
<link rel="stylesheet" href="../_scripts/shell.css">
<link rel="stylesheet" href="screen.css">
</head>
<body class="page-realtrade">
  <div class="topbar"><div class="brand">台股 <span>K 線</span> 瀏覽</div></div>
  <div class="wrap">
    <div class="head">
      <h1>股票總覽</h1>
      <div class="count">共 <b>1,032</b> 檔</div>
    </div>
    <div class="pageopt"><span class="cb"></span>只看上市普通股（排除 ETF、特別股、TDR）</div>
    <div class="tabs">
      <button class="tab">總覽</button>
      <button class="tab">策略</button>
      <button class="tab">動態</button>
      <button class="tab">模擬交易</button>
      <button class="tab on">真實交易</button>
    </div>
    <div class="addbar">
      <div class="addrow">
        <div class="codein ph " data-trigger>輸入股票代號，例如 2330</div>
        <div class="codein w-date" >2026/10/01<svg class="cal" width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="#6B7C90" stroke-width="1.3"><rect x="1.5" y="2.5" width="11" height="10" rx="1.5"/><path d="M1.5 5.5h11M4.5 1v3M9.5 1v3"/></svg></div>
        <div class="codein ph w-num" >成交價</div>
        <div class="codein ph w-num" >股數</div>
        <button class="addbtn dis">加入</button>
      </div>
      <div class="addhint">買進價與股數為你實際的成交價與成交量；股數不是張數，1 張 = 1,000 股</div>
    </div>
    <div class="sumbox">
      <div class="summary">
        <div class="cnt">共 <b>0</b> 筆</div>
        <div class="kv"><span class="k">總成本</span><span class="v none">—</span></div>
        <div class="kv"><span class="k">總未實現損益</span><span class="v none">—</span></div>
        <div class="kv"><span class="k">總報酬率</span><span class="v none">—</span></div>
      </div>
      <div class="feenote">未實現損益已扣手續費 0.1425%（買賣各一次）與證交稅 0.3%，賣出成本以現價估算</div>
    </div>
    <div class="empty">還沒有任何部位，用上面那一列加入</div>
  </div>
</body>
</html>
